name: Production smoke test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Smoke test mode"
        required: true
        default: "dry_run"
        type: choice
        options:
          - "dry_run"
          - "live"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check smoke test syntax
        run: node --check scripts/production_smoke_test.mjs
      - name: Run smoke test
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          AI_AGENT_WEBHOOK_AUTH: ${{ secrets.AI_AGENT_WEBHOOK_AUTH }}
          AI_CONTENT_TEST_MODE: ${{ inputs.mode }}
          AI_CONTENT_TEST_PREFIX: github-smoke
        run: node scripts/production_smoke_test.mjs
